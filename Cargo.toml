[workspace]
members = ["crates/s2v-core", "crates/s2v-audio", "crates/s2v-export", "crates/s2v-cli", "crates/s2v-timeline", "crates/s2v-video", "crates/s2v-render", "crates/s2v-bubbles"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
