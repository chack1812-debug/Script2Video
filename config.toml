# Script2Video 設定ファイル

[audio]
sample_rate = 48000        # 48kHz 固定(変更不可)
microphone_spacing = 0.2
sound_speed = 340.0
air_absorption_coeff = 0.05
room_size = 0.1
reverb_wet = 1.0           # 物理基準値 wet_base へのスケーラ(1.0 = 物理量そのまま)
reference_dist = 1.0
mic_directivity = 0.5          # 単一指向性(カーディオイド)
mic_angle = 30.0              # 左右のマイクを外側へ向ける角度(度。外開き)

[audio.early_reflections]
enabled = true
ear_height = 1.2
listener_offset = [0.0, 0.0]
room_dims_min = [4.0, 5.0, 3.0]
room_dims_max = [25.0, 45.0, 18.0]
early_level = 1.0
wet_distance_slope = 0.1
floor = { reflection_coeff = 0.5, absorption_cutoff_hz = 3500.0 }
ceiling = { reflection_coeff = 0.6, absorption_cutoff_hz = 6000.0 }
front_wall = { reflection_coeff = 0.85, absorption_cutoff_hz = 10000.0 }
back_wall = { reflection_coeff = 0.40, absorption_cutoff_hz = 4000.0 }
side_walls = { reflection_coeff = 0.70, absorption_cutoff_hz = 8000.0 }

[bgm]
crossfade_s = 3.0
se_fade_out_s = 0.05

[export]
fcpxml_2997fps = false

[voice]
trim_threshold_db = -50.0
trim_head_margin_ms = 30
trim_tail_margin_ms = 80
placeholder_ms_per_char = 200
allow_flac = false

[normalize]
target_lufs = -23.0
max_boost_db = 24.0
max_cut_db = 24.0
dump_prefade = false

[mix]
master_ceiling_db = -1.0

[render]
width = 1920                 # 出力の幅(16〜7680 の偶数)
height = 1080                # 出力の高さ(16〜4320 の偶数)
fps = 30                     # フレームレート
crf = 20                     # x264 の品質(小さいほど高画質)
preset = "medium"            # x264 のプリセット
audio_bitrate = "192k"       # AAC のビットレート
fit = "contain"              # 素材の収め方(contain / cover)
background = "#000000"       # 背景色
# default_image = ""         # 画像が無い区間の既定画像
# ffmpeg = ""                # ffmpeg の場所(省略時は PATH)
# ffprobe = ""               # ffprobe の場所(省略時は PATH)
jobs = 1                     # 並列数
font_path = 'C:\Windows\Fonts\YuGothM.ttc'  # 縦書きに使うフォント
font_index = 0               # フォントコレクションの番号
font_size = 44.0             # 文字の大きさ(px)
line_spacing = 0.4           # 行間(文字サイズの比)
bubble_fill = "#FFFFFF"      # 吹き出しの塗り
bubble_stroke = "#000000"    # 吹き出しの枠線の色
bubble_stroke_width = 4.0    # 吹き出しの枠線の太さ
bubble_padding = 28          # 吹き出しの内側の余白
note_fill = "#FFFBE6"        # ト書きの塗り
note_stroke = "#000000"      # ト書きの枠線の色
note_stroke_width = 3.0      # ト書きの枠線の太さ
note_padding = 20            # ト書きの内側の余白
text_color = "#000000"       # 文字色
margin = 40                  # 画面の端からの余白
bubble_gap = 24              # 吹き出し同士の間隔
tail_length = 80             # 吹き出しの尻尾の長さ
bubble_max_height_ratio = 0.55  # 吹き出しの高さの上限(画面の高さの比)
note_max_height_ratio = 0.6     # ト書きの高さの上限(画面の高さの比)

[prompts]
style = ""                   # 画像生成プロンプトの画風
suffix = "縦横比 16:9。画像の中に文字・吹き出しを入れない。"

# --- 音声合成エンジンの接続先(台本で @cast にエンジンを書くときだけ必要。すべて省略可) ---

[voicevox]
url = "http://127.0.0.1:50021"
# 未起動時に自動起動する実行ファイル。省略するとインストール先から自動で探す。
# 絶対パス(例: "C:/VOICEVOX/vv-engine/run.exe")と PATH 上のコマンド名の両方を指定できる。
# exe_path = ""
# exe_path に渡す引数(省略可、既定は空)。
# args = []
# 自動起動の待機秒数(省略時は 60 秒)。モデルロードが遅い場合に増やす。
# startup_timeout_s = 60

[aivis]
url = "http://127.0.0.1:10101"
# exe_path / args / startup_timeout_s は [voicevox] と同じ意味。
# exe_path = ""

[xtts]
url = "http://localhost:8020"
# XTTS は python で起動する場合、コマンド名と引数を分けて指定する。
# exe_path = "python"
# args = ["-m", "xtts_api_server", "--port", "8020"]
# startup_timeout_s = 120

# エンジンへのHTTP呼び出しのタイムアウト(秒)。応答しないエンジンで無期限に待たないための上限。
[http]
connect_timeout_s = 10
request_timeout_s = 180
