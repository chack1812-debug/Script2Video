[package]
name = "s2v-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
s2v-core = { path = "../s2v-core" }
anyhow.workspace = true
thiserror.workspace = true
hound = "3"
rubato = "0.15"
realfft = "3"
rayon = "1"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
ordered-float = "4"
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = "1"
