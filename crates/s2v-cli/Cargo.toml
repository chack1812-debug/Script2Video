[package]
name = "s2v-cli"
version = "0.2.12"
license = "GPL-3.0-or-later"
edition = "2021"

[[bin]]
name = "script2video"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
s2v-core = { path = "../s2v-core" }
s2v-audio = { path = "../s2v-audio" }
s2v-export = { path = "../s2v-export" }
s2v-timeline = { path = "../s2v-timeline" }
s2v-render = { path = "../s2v-render" }
s2v-video = { path = "../s2v-video" }
s2v-bubbles = { path = "../s2v-bubbles" }
s2v-engines = { path = "../s2v-engines" }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hound = "3"
tokio = { version = "1", features = ["rt", "time", "net"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tiny-skia = "0.12"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = "0.12"
